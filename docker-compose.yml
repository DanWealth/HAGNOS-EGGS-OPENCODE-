services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hagnos
      POSTGRES_PASSWORD: hagnos
      POSTGRES_DB: hagnos_eggs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro

  web:
    image: node:20
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
    env_file:
      - ./app/.env
    environment:
      DATABASE_URL: postgres://hagnos:hagnos@db:5432/hagnos_eggs
      BETTER_AUTH_URL: http://localhost:3000
    depends_on:
      - db

volumes:
  pgdata:
