services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hagnos
      POSTGRES_PASSWORD: hagnos
      POSTGRES_DB: hagnos_eggs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app
    environment:
      DATABASE_URL: postgres://hagnos:hagnos@db:5432/hagnos_eggs
      BETTER_AUTH_SECRET: change-me
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
    depends_on:
      - db

volumes:
  pgdata:
